<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="960" fill="#ffffff"/>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Streaming E-Commerce Analytics Pipeline</text>

  <!-- Layer backdrops -->
  <rect x="20" y="55" width="1160" height="185" rx="10" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#1565C0">SPEED LAYER (always-on, seconds-fresh)</text>

  <rect x="20" y="255" width="1160" height="280" rx="10" fill="#E8F5E9" stroke="#A5D6A7"/>
  <text x="40" y="278" font-size="13" font-weight="bold" fill="#2E7D32">BATCH LAYER (hourly, full-history correctness)</text>

  <rect x="20" y="550" width="1160" height="110" rx="10" fill="#F3E5F5" stroke="#CE93D8"/>
  <text x="40" y="573" font-size="13" font-weight="bold" fill="#6A1B9A">MONITORING (Prometheus + Grafana)</text>

  <rect x="20" y="675" width="1160" height="130" rx="10" fill="#FFF8E1" stroke="#FFE082"/>
  <text x="40" y="698" font-size="13" font-weight="bold" fill="#F9A825">SERVING LAYER</text>

  <!-- Speed layer boxes -->
  <rect x="45" y="100" width="130" height="60" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="110" y="125" text-anchor="middle" font-size="13" fill="#111">Producer</text>
  <text x="110" y="142" text-anchor="middle" font-size="11" fill="#555">(Python, Avro)</text>

  <rect x="225" y="100" width="130" height="60" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="290" y="125" text-anchor="middle" font-size="13" fill="#111">Kafka</text>
  <text x="290" y="142" text-anchor="middle" font-size="11" fill="#555">topic: orders</text>

  <rect x="205" y="195" width="170" height="40" rx="6" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>
  <text x="290" y="219" text-anchor="middle" font-size="11" fill="#111">Schema Registry (Avro)</text>

  <rect x="425" y="90" width="155" height="80" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="502" y="120" text-anchor="middle" font-size="13" fill="#111">Spark Structured</text>
  <text x="502" y="137" text-anchor="middle" font-size="13" fill="#111">Streaming</text>
  <text x="502" y="154" text-anchor="middle" font-size="11" fill="#555">validate + window</text>

  <rect x="650" y="90" width="150" height="55" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="725" y="112" text-anchor="middle" font-size="13" fill="#111">bronze/ Parquet</text>
  <text x="725" y="129" text-anchor="middle" font-size="11" fill="#555">partitioned by date</text>

  <rect x="650" y="160" width="150" height="55" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="725" y="182" text-anchor="middle" font-size="13" fill="#111">Postgres</text>
  <text x="725" y="199" text-anchor="middle" font-size="11" fill="#555">live_order_metrics</text>

  <rect x="850" y="90" width="150" height="55" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="925" y="112" text-anchor="middle" font-size="12" fill="#111">Kafka: orders_dlq</text>
  <text x="925" y="129" text-anchor="middle" font-size="10" fill="#555">bad records + reason</text>

  <!-- Speed layer arrows -->
  <line x1="175" y1="130" x2="223" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="355" y1="130" x2="423" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="112" x2="848" y2="112" stroke="#C62828" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="120" x2="648" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="140" x2="648" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="160" x2="230" y2="197" stroke="#F9A825" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="330" y2="197" stroke="#F9A825" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="290" y="248" text-anchor="middle" font-size="9" fill="#777">register/fetch schema</text>

  <!-- Batch layer boxes: gold marts -->
  <rect x="425" y="300" width="155" height="55" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="502" y="322" text-anchor="middle" font-size="13" fill="#111">Airflow</text>
  <text x="502" y="339" text-anchor="middle" font-size="11" fill="#555">batch_quality_marts (@hourly)</text>

  <rect x="425" y="385" width="155" height="55" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="502" y="407" text-anchor="middle" font-size="13" fill="#111">Great Expectations</text>
  <text x="502" y="424" text-anchor="middle" font-size="10" fill="#555">validates newest partition</text>

  <rect x="650" y="385" width="150" height="55" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="725" y="404" text-anchor="middle" font-size="13" fill="#111">dbt</text>
  <text x="725" y="421" text-anchor="middle" font-size="10" fill="#555">DuckDB, 5 models</text>

  <rect x="850" y="385" width="150" height="55" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="925" y="404" text-anchor="middle" font-size="13" fill="#111">Postgres</text>
  <text x="925" y="421" text-anchor="middle" font-size="11" fill="#555">marts schema (x5 tables)</text>

  <!-- Batch layer arrows: gold marts -->
  <line x1="725" y1="145" x2="725" y2="298" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="733" y="270" font-size="10" fill="#555">reads bronze/</text>
  <line x1="502" y1="355" x2="502" y2="383" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="412" x2="648" y2="412" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="405" text-anchor="middle" font-size="9" fill="#555">on success</text>
  <line x1="800" y1="412" x2="848" y2="412" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Batch layer boxes: BigQuery export -->
  <rect x="425" y="470" width="155" height="50" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="502" y="489" text-anchor="middle" font-size="12" fill="#111">Airflow</text>
  <text x="502" y="505" text-anchor="middle" font-size="10" fill="#555">export_to_bigquery (@hourly)</text>

  <rect x="650" y="470" width="150" height="50" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="725" y="489" text-anchor="middle" font-size="12" fill="#111">GCS</text>
  <text x="725" y="505" text-anchor="middle" font-size="10" fill="#555">Parquet, one file per mart</text>

  <rect x="850" y="470" width="150" height="50" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="925" y="489" text-anchor="middle" font-size="12" fill="#111">BigQuery</text>
  <text x="925" y="505" text-anchor="middle" font-size="10" fill="#555">ecommerce_marts dataset</text>

  <!-- Batch layer arrows: BigQuery export -->
  <line x1="925" y1="440" x2="502" y2="468" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="700" y="450" text-anchor="middle" font-size="9" fill="#555">reads marts.*</text>
  <line x1="580" y1="495" x2="648" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="495" x2="848" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Monitoring layer -->
  <rect x="45" y="590" width="140" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="115" y="609" text-anchor="middle" font-size="12" fill="#111">kafka-exporter</text>
  <text x="115" y="625" text-anchor="middle" font-size="10" fill="#555">topic offsets</text>

  <rect x="225" y="590" width="140" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="295" y="609" text-anchor="middle" font-size="12" fill="#111">Spark metrics</text>
  <text x="295" y="625" text-anchor="middle" font-size="10" fill="#555">executor JVM/task stats</text>

  <rect x="450" y="590" width="140" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="520" y="609" text-anchor="middle" font-size="13" fill="#111">Prometheus</text>
  <text x="520" y="625" text-anchor="middle" font-size="10" fill="#555">15s scrape interval</text>

  <rect x="655" y="590" width="140" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="725" y="609" text-anchor="middle" font-size="13" fill="#111">Grafana</text>
  <text x="725" y="625" text-anchor="middle" font-size="10" fill="#555">throughput dashboard</text>

  <line x1="185" y1="615" x2="448" y2="615" stroke="#6A1B9A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="365" y1="615" x2="448" y2="615" stroke="#6A1B9A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="590" y1="615" x2="653" y2="615" stroke="#6A1B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Serving layer box -->
  <rect x="425" y="720" width="230" height="65" rx="6" fill="#ffffff" stroke="#F9A825" stroke-width="1.5"/>
  <text x="540" y="745" text-anchor="middle" font-size="13" fill="#111">Streamlit Dashboard</text>
  <text x="540" y="762" text-anchor="middle" font-size="11" fill="#555">Live tab · Analytics tab</text>
  <text x="540" y="777" text-anchor="middle" font-size="10" fill="#777">auto-refresh every 5s</text>

  <rect x="720" y="720" width="230" height="65" rx="6" fill="#ffffff" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="835" y="745" text-anchor="middle" font-size="13" fill="#111">Hosted (Streamlit Cloud)</text>
  <text x="835" y="762" text-anchor="middle" font-size="10" fill="#555">Neon Postgres, static snapshot</text>
  <text x="835" y="777" text-anchor="middle" font-size="9" fill="#777">sync_to_cloud_demo.py, manual</text>

  <!-- Serving layer arrows -->
  <path d="M 725 215 C 725 400, 610 660, 560 718" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 925 440 C 925 620, 750 700, 640 723" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="655" y1="752" x2="718" y2="752" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="835" font-size="11" fill="#555">Solid arrows: data flow. Dashed arrows: full-history reads, metric scrapes, or the manual cloud-sync step. Red box: dead-letter path for records that fail in-stream validation.</text>
</svg>

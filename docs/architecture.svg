  <line x1="720" y1="240" x2="720" y2="393" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="728" y="365" font-size="10" fill="#555">reads bronze/ + bronze_fulfillment/</text>
  <line x1="502" y1="450" x2="502" y2="478" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="507" x2="648" y2="507" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="500" text-anchor="middle" font-size="9" fill="#555">on success</text>
  <line x1="800" y1="507" x2="848" y2="507" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>


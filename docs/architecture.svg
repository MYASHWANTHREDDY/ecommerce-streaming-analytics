  <text x="290" y="115" text-anchor="middle" font-size="12" fill="#111">Kafka: orders</text>
  <text x="290" y="132" text-anchor="middle" font-size="10" fill="#555">3-broker KRaft, RF 3</text>

  <rect x="425" y="85" width="155" height="80" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="502" y="112" text-anchor="middle" font-size="13" fill="#111">Spark Structured</text>
  <text x="502" y="129" text-anchor="middle" font-size="13" fill="#111">Streaming</text>
  <text x="502" y="146" text-anchor="middle" font-size="10" fill="#555">validate + window + join</text>


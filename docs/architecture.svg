  <text x="502" y="584" text-anchor="middle" font-size="12" fill="#111">Airflow</text>
  <text x="502" y="600" text-anchor="middle" font-size="10" fill="#555">export_to_bigquery (@hourly)</text>

  <rect x="650" y="565" width="150" height="50" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>

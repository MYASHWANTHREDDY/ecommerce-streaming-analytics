  <text x="725" y="600" text-anchor="middle" font-size="10" fill="#555">Parquet, one file per mart</text>

  <rect x="850" y="565" width="150" height="50" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>

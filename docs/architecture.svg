  <text x="725" y="516" text-anchor="middle" font-size="10" fill="#555">DuckDB, 5 models</text>

  <rect x="850" y="480" width="150" height="55" rx="6" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="925" y="499" text-anchor="middle" font-size="13" fill="#111">Postgres</text>
  <text x="925" y="516" text-anchor="middle" font-size="11" fill="#555">marts schema (x5 tables)</text>


  <line x1="580" y1="590" x2="648" y2="590" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="590" x2="848" y2="590" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>


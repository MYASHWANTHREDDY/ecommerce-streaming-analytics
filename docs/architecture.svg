  <text x="720" y="99" text-anchor="middle" font-size="12" fill="#111">bronze/ Parquet</text>
  <text x="720" y="114" text-anchor="middle" font-size="9" fill="#555">partitioned by date</text>

  <rect x="650" y="135" width="140" height="45" rx="6" fill="#ffffff" stroke="#1565C0" stroke-width="1.5"/>
  <text x="720" y="154" text-anchor="middle" font-size="12" fill="#111">Postgres</text>
  <text x="720" y="169" text-anchor="middle" font-size="9" fill="#555">live_order_metrics</text>

  <rect x="850" y="95" width="140" height="55" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>

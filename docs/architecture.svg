  <text x="835" y="892" text-anchor="middle" font-size="9" fill="#777">sync_to_cloud_demo.py, manual</text>

  <!-- Serving layer arrows -->
  <path d="M 720 240 C 720 500, 610 780, 560 833" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 925 535 C 925 720, 750 815, 640 838" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="655" y1="867" x2="718" y2="867" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="950" font-size="11" fill="#555">Solid arrows: data flow. Dashed arrows: full-history reads, metric scrapes, schema lookups, or the manual cloud-sync step. Red box: dead-letter path for records that fail in-stream validation.</text>
</svg>

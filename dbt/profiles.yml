ecommerce_marts:
  target: prod
  outputs:
    prod:
      type: duckdb
      # In-memory local DuckDB — the local tables built here are a scratch
      # intermediate step (materialize -> post-hook copies into Postgres);
      # nothing needs to persist in DuckDB itself between runs.
      path: ':memory:'
      extensions:
        - postgres
      # Same DSN shape the old Python loop in batch_quality_marts.py used
      # (`dbname=... user=... password=... host=... port=...`), just built
      # from the same env vars Airflow already injects (see x-airflow-common
      # in docker-compose.yml) so nothing new needs to be configured.
      attach:
        - path: "dbname={{ env_var('POSTGRES_DB') }} user={{ env_var('POSTGRES_USER') }} password={{ env_var('POSTGRES_PASSWORD') }} host={{ env_var('POSTGRES_HOST') }} port={{ env_var('POSTGRES_PORT') }}"
          type: postgres
          alias: analytics_db

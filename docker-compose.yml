x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__UNIT_TEST_MODE: "False"
    # Dedicated metadata database, kept separate from the `analytics` business database.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:pipeline@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: analytics
    POSTGRES_USER: pipeline
    POSTGRES_PASSWORD: pipeline
    BRONZE_PATH: /data/bronze
    # Airflow "env var connection" convention (AIRFLOW_CONN_<CONN_ID>, URI-encoded),
    # registers postgres_default without a UI/CLI step. Same credentials as the
    # POSTGRES_* vars above -- used by export_to_bigquery.py's PostgresToGCSOperator.
    AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://pipeline:pipeline@postgres:5432/analytics
    # GCP BigQuery export (export_to_bigquery.py). GOOGLE_APPLICATION_CREDENTIALS points
    # at the key file mounted below for actual auth (via Application Default
    # Credentials). That alone isn't enough, though -- confirmed by actually running the
    # DAG: PostgresToGCSOperator's GCS upload step still does get_connection("google_cloud_default")
    # first, and Airflow raises AirflowNotFoundException if no Connection row with that
    # id exists at all, ADC fallback or not. So the env-var connection below (same
    # convention as AIRFLOW_CONN_POSTGRES_DEFAULT above) registers an empty one just to
    # satisfy that lookup; GOOGLE_APPLICATION_CREDENTIALS is still what actually
    # authenticates. See README/CHANGELOG item 5 for the one-time `gcloud` setup that
    # produces the key file.
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: google-cloud-platform://
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    GCP_GCS_BUCKET: ${GCP_GCS_BUCKET:-}
    GCP_BQ_DATASET: ${GCP_BQ_DATASET:-}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/gcp-key.json
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/simulate_bad_partition.py:/opt/airflow/simulate_bad_partition.py:ro
    - ./dbt:/opt/airflow/dbt
    - ./great_expectations:/opt/airflow/great_expectations
    - ./bronze:/data/bronze:ro
    # Mounts the whole (gitignored) directory rather than a single file, so `docker
    # compose up` doesn't fail before the key file exists -- export_to_bigquery.py DAG
    # runs will simply fail with a clear "no such file" until the key is placed here.
    - ./secrets:/opt/airflow/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"        # Port for host tools (producer on your laptop)
    environment:
      # KRaft mode: single node acts as both broker and controller (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Three listener protocols:
      # - INTERNAL: for inter-broker and inter-container traffic (kafka:9092)
      # - CONTROLLER: for KRaft controller quorum (kafka:9093)
      # - EXTERNAL: for host tools like our producer (localhost:29092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092

      # Advertised listeners tell clients where to reach the broker
      # Container-to-container uses INTERNAL hostname (kafka:9092)
      # Host machine tools use EXTERNAL hostname (localhost:29092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      # Map each protocol name to its security protocol (all PLAINTEXT for local dev)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Which listener the controller listens on
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Which listener brokers use to communicate with each other
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # KRaft quorum voters: this broker votes (node 1 @ kafka:9093)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node cluster settings (in production, you'd scale these up)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # KRaft-only config: talks to the broker directly via
      # SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, not the legacy ZK-based
      # SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL -- this stack's apache/kafka:3.8.0
      # runs no ZooKeeper. 7.x picked over 8.0 for a longer track record against
      # non-Confluent-packaged brokers. Verify: clean startup log with no ZK connection
      # attempts, `curl localhost:8081/subjects` returns `[]`.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: analytics
    ports:
      # Host port 5433 (not the default 5432) to avoid colliding with any other local
      # Postgres instance. Container-to-container traffic (Airflow, etc.) is unaffected —
      # it uses the service name/internal port (postgres:5432), not this host mapping.
      - "5433:5432"
    volumes:
      # SQL files in sql/init/ auto-run on first container startup
      - ./sql/init:/docker-entrypoint-initdb.d
      # Named volume persists data across container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: spark
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      # Container-internal Kafka address (distinct from the producer's host-oriented
      # KAFKA_BOOTSTRAP, since Spark runs inside the compose network, not on the host)
      KAFKA_BOOTSTRAP_INTERNAL: kafka:9092
      KAFKA_TOPIC_ORDERS: orders
      KAFKA_TOPIC_DLQ: orders_dlq
      # Container-internal Schema Registry address, mirroring KAFKA_BOOTSTRAP_INTERNAL
      # above -- used to fetch the current Avro schema via REST at job startup.
      SCHEMA_REGISTRY_URL_INTERNAL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: analytics
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      BRONZE_PATH: /data/bronze
      CHECKPOINT_ROOT: /data/checkpoints
    volumes:
      # Bind-mount shadows the image's COPY'd code for fast dev iteration (edit + restart,
      # no rebuild needed unless the Dockerfile/dependencies themselves change).
      - ./streaming:/opt/spark-app
      # Host-visible so bronze/checkpoints survive container restarts (required for the
      # restart/no-duplicates test) and match the Makefile's `clean` target.
      - ./bronze:/data/bronze
      - ./checkpoints:/data/checkpoints
      # Persists --packages jar resolution across restarts (avoids re-fetching from Maven
      # Central every time the container restarts). Bind-mounted (not a named volume) so it's
      # writable by the container's non-root spark user, matching bronze/checkpoints above.
      - ./ivy2-cache:/data/ivy2
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2,org.postgresql:postgresql:42.7.12,org.apache.spark:spark-avro_2.13:4.1.2
      --conf spark.jars.ivy=/data/ivy2
      --conf spark.ui.prometheus.enabled=true
      --conf spark.sql.streaming.metricsEnabled=true
      /opt/spark-app/stream_orders.py

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    # Excluded from bare `docker compose up -d` (make up) so streaming stays a separate,
    # explicit step. Always invoke with `docker compose --profile tools run --rm producer`
    # (explicit flag, not relying on implicit "named service bypasses profile" behavior).
    profiles: ["tools"]
    environment:
      # Same var name producer.py already reads on the host — just overridden to the
      # in-network address here, since this container runs inside the compose network.
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-orders}
      # Same in-network override as KAFKA_BOOTSTRAP above.
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      RATE: ${RATE:-100}
      CORRUPT_PCT: ${CORRUPT_PCT:-0.02}
      DATA_FILE: ${DATA_FILE:-data/sample_1k.csv}
      LOOP: ${LOOP:-true}
    volumes:
      # Bind-mount shadows the image's COPY'd data/ so the full dataset.csv can be swapped
      # in without a rebuild, same pattern as spark's bind-mounts above.
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_started
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    # `depends_on: service_started` only waits for kafka's container process to
    # start, not for its broker listener to actually accept connections (which
    # takes a few more seconds) -- kafka has no healthcheck to depend on instead
    # (adding one would be an existing-service change, which this section is
    # deliberately avoiding). kafka-exporter has no internal retry and exits
    # fatally on its first failed connection, so it loses that race on a fresh
    # `docker compose up`. restart: on-failure lets Compose just retry it, and
    # by the second attempt kafka is up. Confirmed this is the actual failure
    # mode, not guessed: kafka-exporter's own log shows `connection refused`
    # against kafka:9092, not an auth/config error.
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: prometheus
    depends_on:
      kafka-exporter:
        condition: service_started
      spark:
        condition: service_started
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:

  <rect x="200" y="685" width="130" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="265" y="704" text-anchor="middle" font-size="11" fill="#111">lag-reporter</text>
  <text x="265" y="720" text-anchor="middle" font-size="9" fill="#555">real consumer-group lag</text>

  <rect x="355" y="685" width="130" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>

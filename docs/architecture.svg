  <line x1="355" y1="122" x2="423" y2="122" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="112" x2="648" y2="102" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="420" y="720" text-anchor="middle" font-size="9" fill="#555">executor JVM/task stats</text>

  <rect x="560" y="685" width="130" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="625" y="704" text-anchor="middle" font-size="13" fill="#111">Prometheus</text>
  <text x="625" y="720" text-anchor="middle" font-size="9" fill="#555">15s scrape interval</text>

  <rect x="765" y="685" width="130" height="50" rx="6" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="830" y="704" text-anchor="middle" font-size="13" fill="#111">Grafana</text>
  <text x="830" y="720" text-anchor="middle" font-size="9" fill="#555">throughput + lag dashboard</text>

  <line x1="175" y1="710" x2="558" y2="710" stroke="#6A1B9A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="330" y1="710" x2="558" y2="710" stroke="#6A1B9A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="485" y1="710" x2="558" y2="710" stroke="#6A1B9A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="690" y1="710" x2="763" y2="710" stroke="#6A1B9A" stroke-width="1.5" marker-end="url(#arrow)"/>


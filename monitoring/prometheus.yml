global:
  scrape_interval: 15s

scrape_configs:
  # kafka_exporter's real metric surface (verified against its README): broker count,
  # topic/partition offsets, and consumer group lag. It has NO broker request-rate
  # metric -- that lives in Kafka's own JMX MBeans, which this project deliberately
  # doesn't expose (see CHANGELOG.md item 4 for why: no JMX agent injected into the
  # existing apache/kafka image). Message throughput (job "kafka" below) is the
  # closest available substitute, computed from offset deltas rather than a
  # broker-native rate metric.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Driver's built-in Prometheus servlet. The docs page names the feature but not the
  # exact path; running it found the real one by trial: /metrics/prometheus/ 404s,
  # /metrics/executors/prometheus/ is what spark.ui.prometheus.enabled actually serves
  # (SPARK-29032) -- per-executor JVM/task/GC gauges only. Structured-streaming query
  # metrics (batch latency, rows/sec) that spark.sql.streaming.metricsEnabled=true turns
  # on do exist (confirmed live at /metrics/json/, keyed by query UUID) but aren't
  # exposed on any Prometheus-format path Spark ships out of the box, so the "Spark
  # Structured Streaming Latency" dashboard panel has no data source today -- would need
  # a custom metrics.properties sink to close that gap, out of scope for this pass.
  - job_name: spark
    metrics_path: /metrics/executors/prometheus/
    static_configs:
      - targets: ["spark:4040"]

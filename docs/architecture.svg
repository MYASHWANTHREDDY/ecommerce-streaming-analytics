  <rect x="20" y="55" width="1160" height="280" rx="10" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#1565C0">SPEED LAYER (always-on, seconds-fresh)</text>

  <rect x="20" y="350" width="1160" height="280" rx="10" fill="#E8F5E9" stroke="#A5D6A7"/>
  <text x="40" y="373" font-size="13" font-weight="bold" fill="#2E7D32">BATCH LAYER (hourly, full-history correctness)</text>

  <rect x="20" y="645" width="1160" height="130" rx="10" fill="#F3E5F5" stroke="#CE93D8"/>

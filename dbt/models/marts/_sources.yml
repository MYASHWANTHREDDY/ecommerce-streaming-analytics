version: 2

sources:
  - name: bronze
    description: >
      Raw event-level order data written by the Spark streaming job
      (streaming/stream_orders.py), partitioned by event_date. Read directly
      off disk via DuckDB's read_parquet — no separate ingestion/copy step,
      same file glob the old hand-rolled marts SQL in sql/marts/ used.
    tables:
      - name: orders
        meta:
          external_location: "read_parquet('{{ env_var('BRONZE_PATH', '/data/bronze') }}/event_date=*/*.parquet', hive_partitioning = true)"
      - name: fulfillment
        description: >
          order_placed/order_shipped stream-stream join output (see
          streaming/stream_orders.py's Sink 4) -- one row per order with a real
          fulfillment_seconds computed from the two events' actual Kafka
          timestamps, not the dataset's static order_date/ship_date fields.
        meta:
          external_location: "read_parquet('{{ env_var('BRONZE_FULFILLMENT_PATH', '/data/bronze_fulfillment') }}/event_date=*/*.parquet', hive_partitioning = true)"
